<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Helicopter Simulator - Extreme Flight Controller</title>
    <!-- Tailwind CSS for modern responsive UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons for HUD and Controls -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Base Styling & Dark Mode Aesthetics */
        body {
            background-color: #030712;
            color: #10b981;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* Radar Grid Background Animation */
        .radar-bg {
            position: fixed;
            inset: -50%;
            width: 200vw;
            height: 200vh;
            background: 
                radial-gradient(circle, rgba(16, 185, 129, 0.08) 15%, transparent 70%),
                linear-gradient(rgba(16, 185, 129, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 185, 129, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            animation: radarSpin 25s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes radarSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Night Vision Visual Mode */
        body.night-vision {
            background-color: #011a05;
            filter: sepia(100%) hue-rotate(90deg) saturate(300%) contrast(120%);
        }

        /* Rave / Party Mode Strobe Effect */
        body.party-mode {
            animation: partyStrobe 0.4s infinite alternate;
        }

        @keyframes partyStrobe {
            0% { background-color: #4c1d95; color: #facc15; }
            33% { background-color: #065f46; color: #f43f5e; }
            66% { background-color: #1e3a8a; color: #38bdf8; }
            100% { background-color: #831843; color: #a3e635; }
        }

        /* Rotor Blade Spinning Animation */
        .rotor-blur {
            animation: bladeSpin 0.06s linear infinite;
            transform-origin: center center;
        }

        @keyframes bladeSpin {
            0% { opacity: 0.9; transform: rotate(0deg) scaleY(1); }
            50% { opacity: 0.3; transform: rotate(180deg) scaleY(0.3); }
            100% { opacity: 0.9; transform: rotate(360deg) scaleY(1); }
        }

        /* Glowing HUD Elements */
        .hud-glow {
            text-shadow: 0 0 8px rgba(16, 185, 129, 0.8);
            box-shadow: inset 0 0 15px rgba(16, 185, 129, 0.15), 0 0 15px rgba(16, 185, 129, 0.2);
        }

        /* Custom Button Pressed Styles for Touch & Desktop */
        .control-btn {
            background: rgba(15, 23, 42, 0.7);
            border: 1.5px solid rgba(16, 185, 129, 0.5);
            backdrop-filter: blur(4px);
            transition: all 0.1s ease;
        }

        .control-btn:active, .control-btn.active {
            background: rgba(16, 185, 129, 0.4);
            border-color: #10b981;
            transform: scale(0.95);
            box-shadow: 0 0 15px #10b981;
        }

        /* Helicopter Canvas Layer */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
        }
    </style>
</head>
<body class="relative w-screen h-screen">

    <!-- Background Radar Layer -->
    <div class="radar-bg"></div>

    <!-- Takeoff Overlay to initialize AudioContext & Flight Engine -->
    <div id="overlay" class="fixed inset-0 bg-slate-950/95 z-50 flex flex-col items-center justify-center p-4 text-center">
        <div class="max-w-md w-full border border-emerald-500/40 p-8 rounded-2xl bg-slate-900/80 backdrop-blur-md shadow-2xl shadow-emerald-500/20">
            <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-emerald-500/10 flex items-center justify-center border border-emerald-500/30">
                <i class="fa-solid font-bold text-4xl text-emerald-400 fa-helicopter animate-bounce"></i>
            </div>
            <button id="takeoff-btn" onclick="initSimulator()" class="w-full py-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-lg tracking-widest rounded-xl shadow-lg shadow-emerald-500/30 transition-all hover:scale-105 active:scale-95">
                INITIATE TAKEOFF <i class="fa-solid fa-plane-departure ml-2"></i>
            </button>
        </div>
    </div>

    <!-- Particle & Canvas Render Screen -->
    <canvas id="flightCanvas"></canvas>

    <!-- Top Tactical HUD Bar -->
    <div class="fixed top-3 left-3 right-3 z-30 pointer-events-none flex justify-between items-start text-xs sm:text-sm">
        <div class="hud-glow bg-slate-900/80 border border-emerald-500/30 rounded-xl p-3 backdrop-blur-md space-y-1">
            <div class="flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                <span class="font-bold tracking-widest text-emerald-400">SYS: ACTIVE</span>
            </div>
            <div>ALT: <span id="hud-alt" class="font-bold text-white">1200</span> FT</div>
            <div>SPD: <span id="hud-spd" class="font-bold text-white">0</span> KTS</div>
            <div>HDG: <span id="hud-hdg" class="font-bold text-white">000</span>°</div>
        </div>

        <!-- Audio Waveform Visualizer Header -->
        <div class="hidden md:flex flex-col items-center hud-glow bg-slate-900/80 border border-emerald-500/30 rounded-xl p-3 backdrop-blur-md">
            <span class="text-[10px] text-emerald-500 mb-1 tracking-widest">AUDIO FREQUENCY</span>
            <canvas id="waveformCanvas" width="160" height="30" class="rounded bg-slate-950/50"></canvas>
        </div>

        <!-- Mode Buttons (Interactive) -->
        <div class="pointer-events-auto flex flex-col sm:flex-row gap-2">
            <button onclick="toggleNightVision()" class="control-btn px-3 py-2 rounded-lg text-emerald-400 text-xs font-bold flex items-center justify-center gap-2">
                <i class="fa-solid fa-eye"></i> <span class="hidden sm:inline">NIGHT VISION</span>
            </button>
            <button onclick="togglePartyMode()" class="control-btn px-3 py-2 rounded-lg text-emerald-400 text-xs font-bold flex items-center justify-center gap-2">
                <i class="fa-solid fa-bolt"></i> <span class="hidden sm:inline">PARTY MODE</span>
            </button>
            <button id="autopilot-btn" onclick="toggleAutopilot()" class="control-btn px-3 py-2 rounded-lg text-emerald-400 text-xs font-bold flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate"></i> <span>AUTOPILOT</span>
            </button>
        </div>
    </div>

    <!-- On-Screen Flight Touch / Mouse Controller HUD Overlay -->
    <div class="fixed bottom-4 left-4 right-4 z-30 pointer-events-none flex justify-between items-end">
        
        <!-- Directional D-PAD -->
        <div class="pointer-events-auto grid grid-cols-3 gap-2 w-36 h-36 sm:w-44 sm:h-44 p-2 bg-slate-900/70 border border-emerald-500/30 rounded-2xl backdrop-blur-md hud-glow">
            <div></div>
            <button onmousedown="startControl('up')" onmouseup="stopControl('up')" onmouseleave="stopControl('up')" ontouchstart="startControl('up')" ontouchend="stopControl('up')" class="control-btn rounded-xl flex items-center justify-center text-emerald-400 text-xl font-bold">
                <i class="fa-solid fa-chevron-up"></i>
            </button>
            <div></div>

            <button onmousedown="startControl('left')" onmouseup="stopControl('left')" onmouseleave="stopControl('left')" ontouchstart="startControl('left')" ontouchend="stopControl('left')" class="control-btn rounded-xl flex items-center justify-center text-emerald-400 text-xl font-bold">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
            <div class="flex items-center justify-center text-[10px] text-emerald-600 font-black">STEER</div>
            <button onmousedown="startControl('right')" onmouseup="stopControl('right')" onmouseleave="stopControl('right')" ontouchstart="startControl('right')" ontouchend="stopControl('right')" class="control-btn rounded-xl flex items-center justify-center text-emerald-400 text-xl font-bold">
                <i class="fa-solid fa-rotate-right"></i>
            </button>

            <div></div>
            <button onmousedown="startControl('down')" onmouseup="stopControl('down')" onmouseleave="stopControl('down')" ontouchstart="startControl('down')" ontouchend="stopControl('down')" class="control-btn rounded-xl flex items-center justify-center text-emerald-400 text-xl font-bold">
                <i class="fa-solid fa-chevron-down"></i>
            </button>
            <div></div>
        </div>

        <!-- Action Control Buttons -->
        <div class="pointer-events-auto flex flex-col gap-2">
            <button onmousedown="startControl('boost')" onmouseup="stopControl('boost')" onmouseleave="stopControl('boost')" ontouchstart="startControl('boost')" ontouchend="stopControl('boost')" class="control-btn w-28 sm:w-36 py-3 rounded-xl text-xs sm:text-sm font-black text-amber-400 border-amber-500/50 flex items-center justify-center gap-2">
                <i class="fa-solid fa-gauge-high"></i> BOOST
            </button>
            <button onclick="trigger360Spin()" class="control-btn w-28 sm:w-36 py-3 rounded-xl text-xs sm:text-sm font-black text-cyan-400 border-cyan-500/50 flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrows-spin"></i> 360° SPIN
            </button>
        </div>
    </div>

    <!-- Hidden / Synthesized Web Audio Generator -->
    <script>
        /**
         * HELICOPTER PHYSICS AND GRAPHICS ENGINE
         */
        const canvas = document.getElementById('flightCanvas');
        const ctx = canvas.getContext('2d');
        const waveCanvas = document.getElementById('waveformCanvas');
        const waveCtx = waveCanvas ? waveCanvas.getContext('2d') : null;

        // Load User Custom Assets
        const imgBody = new Image();
        imgBody.src = 'helikopter_zero_wings.png';

        const imgWingRight = new Image();
        imgWingRight.src = 'helikopter-right_wing.png';

        const imgWingLeft = new Image();
        imgWingLeft.src = 'helikopter_left_wing.png';

        // Audio Element Integration
        const audioHeli = new Audio('Helikopter.mp4');
        audioHeli.loop = true;

        // Viewport Resizing
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Helicopter State Object
        const heli = {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            vx: 0,
            vy: 0,
            speed: 0,
            heading: 0, // Facing angle in degrees (0 = Facing UP/Forward)
            spin: 0,    // Stunt rotation angle
            altitude: 1200,
            boostActive: false,
            autopilot: false,
            autopilotAngle: 0,
            wingToggle: false,
            lastWingSwitch: 0
        };

        // Input Control States
        const inputs = {
            up: false,
            down: false,
            left: false,
            right: false,
            boost: false
        };

        // Particles System
        const particles = [];
        class Particle {
            constructor(x, y, headingRad, isBoost) {
                // Exhaust particles behind the helicopter
                const backDist = 30;
                this.x = x - Math.sin(headingRad) * backDist + (Math.random() * 10 - 5);
                this.y = y + Math.cos(headingRad) * backDist + (Math.random() * 10 - 5);
                this.size = isBoost ? Math.random() * 6 + 3 : Math.random() * 4 + 1;
                this.speedX = -Math.sin(headingRad) * (Math.random() * 2) + (Math.random() - 0.5);
                this.speedY = Math.cos(headingRad) * (Math.random() * 2) + (Math.random() - 0.5);
                this.life = 1.0;
                this.decay = Math.random() * 0.03 + 0.015;
                this.color = isBoost ? '#f59e0b' : '#10b981';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= this.decay;
            }
            draw(context) {
                context.save();
                context.globalAlpha = Math.max(0, this.life);
                context.fillStyle = this.color;
                context.beginPath();
                context.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                context.fill();
                context.restore();
            }
        }

        // Initialize Audio Engine
        function setupAudio() {
            audioHeli.play().catch(e => console.log("Audio autoplay prevented by browser:", e));
        }

        function updateAudioEngine(speed, isBoost) {
            if (audioHeli && !audioHeli.paused) {
                // Modulate playback pitch rate according to flight speed
                const pitch = 0.8 + (speed / 15) * 0.5 + (isBoost ? 0.3 : 0);
                audioHeli.playbackRate = Math.min(Math.max(pitch, 0.7), 2.0);
            }
        }

        // Initialize Simulator from Overlay
        function initSimulator() {
            document.getElementById('overlay').style.display = 'none';
            setupAudio();
            requestAnimationFrame(gameLoop);
        }

        // Controller Helper Functions
        function startControl(dir) {
            inputs[dir] = true;
            const btn = event?.currentTarget;
            if (btn) btn.classList.add('active');
        }

        function stopControl(dir) {
            inputs[dir] = false;
            const btn = event?.currentTarget;
            if (btn) btn.classList.remove('active');
        }

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') inputs.up = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') inputs.down = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') inputs.left = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') inputs.right = true;
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') inputs.boost = true;
            if (e.code === 'Space') trigger360Spin();
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') inputs.up = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') inputs.down = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') inputs.left = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') inputs.right = false;
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') inputs.boost = false;
        });

        // Special Actions
        function trigger360Spin() {
            let start = null;
            function spinStep(timestamp) {
                if (!start) start = timestamp;
                let progress = (timestamp - start) / 600; // 600ms full rotation
                if (progress < 1) {
                    heli.spin = progress * 360;
                    requestAnimationFrame(spinStep);
                } else {
                    heli.spin = 0;
                }
            }
            requestAnimationFrame(spinStep);
        }

        function toggleAutopilot() {
            heli.autopilot = !heli.autopilot;
            const btn = document.getElementById('autopilot-btn');
            if (heli.autopilot) {
                btn.classList.add('bg-emerald-500', 'text-slate-950');
            } else {
                btn.classList.remove('bg-emerald-500', 'text-slate-950');
            }
        }

        function toggleNightVision() {
            document.body.classList.toggle('night-vision');
            document.body.classList.remove('party-mode');
        }

        function togglePartyMode() {
            document.body.classList.toggle('party-mode');
            document.body.classList.remove('night-vision');
        }

        // Render Image Helicopter with Rotor Animation
        function drawHelicopter(ctx, x, y, headingDeg, spinAngle, timestamp) {
            ctx.save();
            ctx.translate(x, y);
            
            // Total visual rotation in radians
            const totalAngle = (headingDeg + spinAngle) * Math.PI / 180;
            ctx.rotate(totalAngle);

            // Alternate wing visibility every 60ms (0.06s)
            if (timestamp - heli.lastWingSwitch > 60) {
                heli.wingToggle = !heli.wingToggle;
                heli.lastWingSwitch = timestamp;
            }

            const currentWing = heli.wingToggle ? imgWingRight : imgWingLeft;

            // Draw Base Body
            if (imgBody.complete && imgBody.naturalWidth !== 0) {
                ctx.drawImage(imgBody, -imgBody.width / 2, -imgBody.height / 2);
            } else {
                // Fallback indicator
                ctx.fillStyle = '#10b981';
                ctx.fillRect(-20, -30, 40, 60);
            }

            // Draw Rotor Wings Overlay
            if (currentWing.complete && currentWing.naturalWidth !== 0) {
                ctx.drawImage(currentWing, -currentWing.width / 2, -currentWing.height / 2);
            }

            ctx.restore();
        }

        // Waveform Visualizer Drawing
        function drawWaveform() {
            if (!waveCtx) return;
            waveCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
            waveCtx.strokeStyle = '#10b981';
            waveCtx.lineWidth = 1.5;
            waveCtx.beginPath();
            
            const slice = waveCanvas.width / 16;
            for (let i = 0; i < 16; i++) {
                const amplitude = Math.sin(Date.now() * 0.01 + i) * (heli.speed + 2);
                const x = i * slice;
                const y = waveCanvas.height / 2 + amplitude;
                if (i === 0) waveCtx.moveTo(x, y);
                else waveCtx.lineTo(x, y);
            }
            waveCtx.stroke();
        }

        // Main Physics & Animation Loop
        function gameLoop(timestamp) {
            // Clear Screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const accel = inputs.boost ? 0.6 : 0.3;
            const turnSpeed = 3.5; // Turn speed in degrees per frame
            const friction = 0.96;

            if (heli.autopilot) {
                // Circular Orbit Path across screen
                heli.autopilotAngle += 0.02;
                const radius = Math.min(canvas.width, canvas.height) * 0.35;
                const targetX = canvas.width / 2 + Math.cos(heli.autopilotAngle) * radius;
                const targetY = canvas.height / 2 + Math.sin(heli.autopilotAngle) * radius;

                const dx = targetX - heli.x;
                const dy = targetY - heli.y;
                
                // Align heading with direction of motion
                const targetHeading = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
                heli.heading = targetHeading;

                heli.vx += dx * 0.01;
                heli.vy += dy * 0.01;
            } else {
                // Steering Controls (Rotates Helicopter Nose)
                if (inputs.left) heli.heading -= turnSpeed;
                if (inputs.right) heli.heading += turnSpeed;

                // Normalize heading between 0 and 360
                heli.heading = (heli.heading + 360) % 360;

                // Convert Heading Angle to Radians (0 deg facing straight UP / -Y)
                const headingRad = (heli.heading - 90) * (Math.PI / 180);

                // Forward Thrust (W / Up Arrow)
                if (inputs.up) {
                    heli.vx += Math.cos(headingRad) * accel;
                    heli.vy += Math.sin(headingRad) * accel;
                }

                // Reverse Thrust / Brake (S / Down Arrow)
                if (inputs.down) {
                    heli.vx -= Math.cos(headingRad) * (accel * 0.5);
                    heli.vy -= Math.sin(headingRad) * (accel * 0.5);
                }
            }

            // Apply Velocity & Friction
            heli.vx *= friction;
            heli.vy *= friction;
            heli.x += heli.vx;
            heli.y += heli.vy;

            // Viewport Boundary Bouncing
            const margin = 50;
            if (heli.x < margin) { heli.x = margin; heli.vx *= -0.5; }
            if (heli.x > canvas.width - margin) { heli.x = canvas.width - margin; heli.vx *= -0.5; }
            if (heli.y < margin) { heli.y = margin; heli.vy *= -0.5; }
            if (heli.y > canvas.height - margin) { heli.y = canvas.height - margin; heli.vy *= -0.5; }

            // Calculate Speed
            heli.speed = Math.sqrt(heli.vx * heli.vx + heli.vy * heli.vy);

            // Altitude fluctuations
            heli.altitude = 1200 + Math.round(Math.sin(Date.now() * 0.003) * 50 + heli.speed * 20);

            // Generate Particle Exhaust
            if (heli.speed > 1 || inputs.boost) {
                const headingRad = (heli.heading - 90) * (Math.PI / 180);
                particles.push(new Particle(heli.x, heli.y, headingRad, inputs.boost));
            }

            // Draw & Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(ctx);
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            // Draw Custom Image Helicopter
            drawHelicopter(ctx, heli.x, heli.y, heli.heading, heli.spin, timestamp);

            // Update Audio Pitch Modulation
            updateAudioEngine(heli.speed, inputs.boost);

            // Update HUD Readouts
            document.getElementById('hud-alt').innerText = heli.altitude;
            document.getElementById('hud-spd').innerText = Math.round(heli.speed * 15);
            document.getElementById('hud-hdg').innerText = String(Math.round(heli.heading)).padStart(3, '0');

            // Draw Waveform
            drawWaveform();

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
